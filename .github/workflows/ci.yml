name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# On a branch or PR a newer push cancels the run in progress (and any pending one). On main the
# group is the commit itself, so every merge keeps its own complete run, never superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The three `make ci` targets run as separate jobs so one failure does not hide the others
# (make stops at the first failing target), and each can be a required check on its own.
# Real-data and Python-parity suites (make realdata/pyparity) need off-host data and stay local.
jobs:
  check:
    name: check (fmt, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # the exact version of its go directive
          cache: true # module and build cache, keyed on go.sum
      - run: make check

  cross:
    name: cross (static linux + windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make cross

  lint:
    name: lint (staticcheck, linux + windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # make lint installs the pinned staticcheck into bin/tools when missing; cache it per version.
      - uses: actions/cache@v4
        with:
          path: bin/tools
          key: staticcheck-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make lint
